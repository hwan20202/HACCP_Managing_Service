# 결재 영역 구현 지도 — 사람용: docs/handover/guide/document-guide.md 3장
# 필드 설명: docs/reference/features/README.md (작성 예정)
# 기준: main 2234f02 (2026-10-27)

- id: F-WF-01
  name: 결재 올리기(상신·재상신)
  status: done
  guide: docs/handover/guide/document-guide.md#31-문서를-결재-올리기

  ui:
    page: doc-box                       # 메뉴 "문서함" → 문서 상세 결재 영역
    files:
      - frontend/templates/includes/doc-box-nav.html
      - frontend/static/temp-entry/approval/approval.js   # 결재 영역·상신 확인 창
    notes: >
      [결재 상신] 활성 여부는 서버가 준 permissions.submit, 결재선 미리 보기는
      문서 상세의 approval_line을 그대로 그린다. 화면에서 권한을 다시 계산하지 않는다.

  api:
    - method: POST
      path: /api/v1/documents/<document_id>/submit
      spec: docs/handover/api/document.md#wf-a01
      body: {expected_version: int}
      returns: 201 {document, request}

  backend:
    entry: backend/apps/document_workflow/api.py::submit
    services:
      - backend/apps/document_workflow/services.py::submit          # 트랜잭션 경계
      - backend/apps/document_workflow/services.py::_line_for       # 권한 → 결재선
      - backend/apps/document_workflow/services.py::_submit_steps   # 잠금 → 스냅샷 → 회차
      - backend/apps/staff/roles.py::require_submitter
      - backend/apps/staff/roles.py::require_approval_line
      - backend/apps/documents/services.py::lock_for_review         # completed → submitted
      - backend/apps/approvals/services.py::open_request            # 회차·칸 생성
    models: null                        # 확인 필요(H5)

  errors:
    - {code: ROLE_REQUIRED, status: 403, at: backend/apps/staff/roles.py}
    - {code: NO_APPROVAL_LINE, status: 409, at: backend/apps/staff/roles.py}
    - {code: VERSION_CONFLICT, status: 409, at: backend/apps/documents/errors.py}

  settings: [HACCP_DOC_MENU]           # P16: HACCP_ROLES_FILE 없앰 — 문서 권한은 DB(admin_settings)
  checks: [document_workflow.W002]   # backend/apps/document_workflow/checks.py (P16: E002 없앰, W002 = 빈 권한 경고)

  tests:
    - backend/apps/document_workflow/tests/test_api.py
    - backend/apps/document_workflow/tests/test_services.py
    - backend/apps/document_workflow/tests/test_p14_roles.py

  decisions: [D-055, D-182, D-191, D-198, D-234]
  depends_on: [F-DOC-04, F-ROLE-01]
  affects: [F-WF-02, F-WF-03, F-WF-04, F-WF-06, F-PRT-01]

  change_notes:
    - 일괄 상신(F-WF-06, batch_submit)이 _submit_steps를 같이 쓴다. 한쪽을 고치면 둘 다 테스트한다.
    - 잠글 때 증빙 파일 보존 표시(D-058)와 성적서 유무 확정(D-234)이 같은 트랜잭션에서 일어난다.
    - 결재선 규칙을 바꾸면 화면 미리 보기(approval_line)와 확인 창이 같은 함수를 쓰는지 확인한다.
    - 문서 권한(결재 칸 구성·담당자)은 DB 표 role_*(backend/apps/admin_settings, ERD docs/handover/erd/document.md#관리-설정)가 원본이다. 저장 방식을 바꾸면 staff/roles.py(load·_resolve), checks.py(W002), docs/handover/installation.md "관리 설정"도 고친다.

  verify:
    - python backend/manage.py test apps.document_workflow.tests.test_p14_roles --settings=config.settings.test
    - python backend/manage.py test apps.document_workflow.tests.test_api --settings=config.settings.test

  verified_at: {commit: 2234f02, date: 2026-10-27, by: 문서-코드 대조(실행 확인 전)}
